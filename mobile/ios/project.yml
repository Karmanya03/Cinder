name: CinderMobile
options:
  bundleIdPrefix: com.karmanya03
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.karmanya03.cinder
    LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../native/target/aarch64-apple-ios/release"
    OTHER_LDFLAGS: "$(inherited) -lcinder_mobile -lc++"
targets:
  CinderMobile:
    type: application
    platform: iOS
    sources:
      - path: CinderMobile
    info:
      path: CinderMobile/Info.plist
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
