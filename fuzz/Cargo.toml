[package]
name = "cinder-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.cinder-core]
path = "../cinder-core"

# Prevent this crate from being part of the parent workspace.
[workspace]

[[bin]]
name = "archive_parser"
path = "fuzz_targets/archive_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "extract_paths"
path = "fuzz_targets/extract_paths.rs"
test = false
doc = false
bench = false
