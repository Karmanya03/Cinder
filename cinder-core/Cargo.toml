[package]
name = "cinder-core"
version = "1.0.0"
edition = "2021"
description = "Deduplicating, seekable, optionally encrypted compressor/archiver library"
license = "MIT"
repository = "https://github.com/Karmanya03/Cinder"
readme = "../README.md"

[dependencies]
argon2 = "0.5.3"
blake3 = { version = "1.8.7", features = ["serde"] }
chacha20poly1305 = "0.11.0"
crossbeam-channel = "0.5.16"
ed25519-dalek = "2.2.0"
fastcdc = "4.0.1"
getrandom = "0.4.3"
ignore = "0.4.33"
liblzma = "0.4.8"
libc = "0.2.174"
memmap2 = "0.9.11"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
walkdir = "2.5.0"
zeroize = "1.9.0"
zstd = "0.13.3"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.11.0"
tempfile = "3.27.0"
zstd = "0.13.3"

[[bench]]
name = "pipeline_bench"
harness = false
